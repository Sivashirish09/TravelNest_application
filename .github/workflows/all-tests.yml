name: Scale E2E suites to 1800 test cases

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches: ["main", "develop", "master", "**"]
  pull_request:
    branches: ["main", "develop", "master", "**"]
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all test suites (1,800 test cases)"
        required: false
        default: "true"
        type: boolean

# ============================================================
# PERMISSIONS FOR GITHUB PAGES & ARTIFACTS
# ============================================================
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ============================================================
# GLOBAL ENV
# ============================================================
env:
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # JOB 1 — SELENIUM WEBSITE TESTS (300)
  # ============================================================
  selenium-website-tests:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: selenium-tests
        run: npm install --no-audit --no-fund

      - name: 🌐 Run Selenium 300 Website Tests
        working-directory: selenium-tests
        run: node selenium-runner.js

      - name: 📤 Upload Selenium Web Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-report
          path: selenium-tests/selenium-web-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 2 — APPIUM ANDROID TESTS (300)
  # ============================================================
  appium-android-tests:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: appium-tests
        run: npm install --no-audit --no-fund

      - name: 📱 Run Appium 300 Android Tests
        working-directory: appium-tests
        run: node appium-runner.js

      - name: 📤 Upload Appium Android Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-report
          path: appium-tests/appium-android-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 3 — UNIT TESTS API (300)
  # ============================================================
  unit-tests-api:
    name: 🔬 Unit Tests — API (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: unit-tests
        run: npm install --no-audit --no-fund

      - name: 🔬 Run 300 API & Logic Unit Tests
        working-directory: unit-tests
        run: node unit-runner.js

      - name: 📤 Upload Unit Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: unit-tests/unit-test-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 4 — VALIDATION TESTS (300)
  # ============================================================
  validation-tests:
    name: ✅ Validation Tests (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: validation-tests
        run: npm install --no-audit --no-fund

      - name: ✅ Run 300 Schema & Security Validation Tests
        working-directory: validation-tests
        run: node validation-runner.js

      - name: 📤 Upload Validation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-test-report
          path: validation-tests/validation-test-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 5 — DEPLOYMENT STATUS (300)
  # ============================================================
  deployment-status-tests:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: deployment-tests
        run: npm install --no-audit --no-fund

      - name: 🚀 Run 300 Deployment & Health Tests
        working-directory: deployment-tests
        run: node deployment-runner.js

      - name: 📤 Upload Deployment Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-test-report
          path: deployment-tests/deployment-test-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 6 — LOAD TESTING — PERFORMANCE (300)
  # ============================================================
  load-testing-performance:
    name: 📈 Load Testing — Performance (300)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        working-directory: load-tests
        run: npm install --no-audit --no-fund

      - name: 📈 Run 300 Load & Performance Tests (100 Virtual Users)
        working-directory: load-tests
        run: node load-runner.js

      - name: 📤 Upload Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: load-tests/load-test-report.xlsx
          retention-days: 30

  # ============================================================
  # JOB 7 — COMPILE MASTER REPORT & DEPLOY
  # ============================================================
  compile-master-report:
    name: 📦 Compile Master Report & Deploy
    needs:
      - selenium-website-tests
      - appium-android-tests
      - unit-tests-api
      - validation-tests
      - deployment-status-tests
      - load-testing-performance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          npm install --no-audit --no-fund
          cd reports && npm install --no-audit --no-fund && cd ..

      - name: 📥 Download All Suite Reports
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports

      - name: 🔄 Copy Downloaded Reports to reports/ Directory
        run: |
          mkdir -p reports
          cp -r downloaded-reports/selenium-web-report/selenium-web-report.xlsx reports/ 2>/dev/null || true
          cp -r downloaded-reports/appium-android-report/appium-android-report.xlsx reports/ 2>/dev/null || true
          cp -r downloaded-reports/unit-test-report/unit-test-report.xlsx reports/ 2>/dev/null || true
          cp -r downloaded-reports/validation-test-report/validation-test-report.xlsx reports/ 2>/dev/null || true
          cp -r downloaded-reports/deployment-test-report/deployment-test-report.xlsx reports/ 2>/dev/null || true
          cp -r downloaded-reports/load-test-report/load-test-report.xlsx reports/ 2>/dev/null || true

      - name: 📊 Compile Master 1,800 Test Cases Report
        working-directory: reports
        run: node compile-master-report.js

      - name: 📤 Upload Unified Master E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-e2e-report
          path: reports/full-e2e-report.xlsx
          retention-days: 60

      - name: 🔨 Build Vite Application
        run: npm run build

      - name: 🌐 Prepare GitHub Pages Artifact
        run: |
          mkdir -p dist/reports
          cp -r reports/* dist/reports/ 2>/dev/null || true
          cp reports/index.html dist/reports/index.html 2>/dev/null || true

      - name: 🚀 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 🌐 Deploy Application & Test Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
