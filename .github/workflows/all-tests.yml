name: 🧪 TravelNest — Full Test Suite (All 4 Tests)

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches: [ "main", "develop", "master", "brpo", "**" ]
  pull_request:
    branches: [ "main", "develop", "master", "brpo", "**" ]
  workflow_dispatch:
    inputs:
      run_selenium:
        description: 'Run Selenium Tests'
        required: false
        default: 'true'
        type: boolean
      run_appium:
        description: 'Run Appium Tests'
        required: false
        default: 'true'
        type: boolean
      run_dast:
        description: 'Run DAST Security Tests'
        required: false
        default: 'true'
        type: boolean
      run_load:
        description: 'Run Load/Baseline Tests'
        required: false
        default: 'true'
        type: boolean

# ============================================================
# GLOBAL ENV
# ============================================================
env:
  NODE_VERSION: '20'
  REPORTS_DIR: all-test-reports
  SELENIUM_REPORT: selenium-tests/test-summary.xlsx
  APPIUM_REPORT: appium-tests/appium-test-summary.xlsx
  DAST_REPORT: Vulnerability Test Results/dast-test-results.xlsx
  LOAD_REPORT: Load Test Results/load-test-results.xlsx

jobs:
  # ============================================================
  # JOB 1 — SELENIUM E2E TESTS
  # ============================================================
  selenium-tests:
    name: 🌐 Selenium E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_selenium == 'true' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: 📦 Install Selenium Dependencies
        working-directory: selenium-tests
        run: npm ci --prefer-offline || npm install

      - name: 🌐 Setup Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 🔍 Check Chrome & ChromeDriver Versions
        run: |
          google-chrome --version
          chromedriver --version || true

      - name: 🌐 Install Matching ChromeDriver
        working-directory: selenium-tests
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+' | head -1)
          echo "Chrome Major Version: $CHROME_VERSION"
          npm install chromedriver@${CHROME_VERSION} --save-dev || npm install chromedriver --save-dev

      - name: 🧪 Run Selenium Tests (Headless)
        working-directory: selenium-tests
        run: |
          echo "Starting Selenium test suite..."
          node tests/login-tests.js
        env:
          DISPLAY: ':99'
        timeout-minutes: 10

      - name: 📁 Verify Selenium Report Generated
        run: |
          if [ -f "selenium-tests/test-summary.xlsx" ]; then
            echo "✅ Selenium report generated successfully"
            ls -lh selenium-tests/test-summary.xlsx
          else
            echo "❌ Selenium report NOT found"
            exit 1
          fi

      - name: 📤 Upload Selenium Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 📊-Selenium-Test-Report
          path: selenium-tests/test-summary.xlsx
          retention-days: 30

  # ============================================================
  # JOB 2 — APPIUM MOBILE TESTS
  # ============================================================
  appium-tests:
    name: 📱 Appium Mobile Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_appium == 'true' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: appium-tests/package-lock.json

      - name: 📦 Install Appium Dependencies
        working-directory: appium-tests
        run: npm ci --prefer-offline || npm install

      - name: 📱 Run Appium Tests
        # Note: In CI, no Android emulator is available.
        # The test script gracefully handles this and still
        # generates a full 300-row Excel report with env status.
        working-directory: appium-tests
        run: |
          echo "Starting Appium test suite (offline/simulation mode in CI)..."
          node appium-tests.js
        env:
          CI: 'true'
        timeout-minutes: 10

      - name: 📁 Verify Appium Report Generated
        run: |
          if [ -f "appium-tests/appium-test-summary.xlsx" ]; then
            echo "✅ Appium report generated successfully"
            ls -lh appium-tests/appium-test-summary.xlsx
          else
            echo "❌ Appium report NOT found"
            exit 1
          fi

      - name: 📤 Upload Appium Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 📊-Appium-Test-Report
          path: appium-tests/appium-test-summary.xlsx
          retention-days: 30

  # ============================================================
  # JOB 3 — DAST SECURITY TESTS
  # ============================================================
  dast-security-tests:
    name: 🔐 DAST Security Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_dast == 'true' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dast-tests/package-lock.json

      - name: 📦 Install DAST Dependencies
        working-directory: dast-tests
        run: npm ci --prefer-offline || npm install

      - name: 🏗️ Create Output Directory
        run: mkdir -p "Vulnerability Test Results"

      - name: 🔐 Run DAST Security Test Suite
        working-directory: dast-tests
        run: |
          echo "Starting DAST security test suite..."
          node dast-runner.js
        env:
          # If the API is running (e.g., in a service container), set this:
          # API_URL: http://localhost:8000/api/v1
          CI: 'true'
        timeout-minutes: 5

      - name: 📁 Verify DAST Report Generated
        run: |
          if [ -f "Vulnerability Test Results/dast-test-results.xlsx" ]; then
            echo "✅ DAST report generated successfully"
            ls -lh "Vulnerability Test Results/dast-test-results.xlsx"
          else
            echo "❌ DAST report NOT found"
            exit 1
          fi

      - name: 📤 Upload DAST Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 📊-DAST-Security-Report
          path: Vulnerability Test Results/dast-test-results.xlsx
          retention-days: 30

      - name: 📤 Upload Full Security Assessment Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 📋-Security-Assessment-Full
          path: |
            Vulnerability Test Results/
          retention-days: 30

  # ============================================================
  # JOB 4 — BASELINE / LOAD TESTS
  # ============================================================
  load-tests:
    name: 🚀 Baseline / Load Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_load == 'true' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: load-tests/package-lock.json

      - name: 📦 Install Load Test Dependencies
        working-directory: load-tests
        run: npm ci --prefer-offline || npm install

      - name: 🏗️ Create Output Directory
        run: mkdir -p "Load Test Results"

      - name: 🚀 Run Baseline Load Tests
        # Config: 100 virtual users × 60 seconds × 10 scenarios
        working-directory: load-tests
        run: |
          echo "Starting Baseline Load Test (100 users × 60s)..."
          node load-runner.js
        env:
          # If the API is running, set to live URL:
          # API_URL: http://localhost:8000
          CI: 'true'
        timeout-minutes: 15

      - name: 📁 Verify Load Test Report Generated
        run: |
          if [ -f "Load Test Results/load-test-results.xlsx" ]; then
            echo "✅ Load test report generated successfully"
            ls -lh "Load Test Results/load-test-results.xlsx"
          else
            echo "❌ Load test report NOT found"
            exit 1
          fi

      - name: 📤 Upload Load Test Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 📊-Load-Test-Report
          path: Load Test Results/load-test-results.xlsx
          retention-days: 30

  # ============================================================
  # JOB 5 — BUNDLE ALL REPORTS INTO ONE ARTIFACT
  # ============================================================
  bundle-all-reports:
    name: 📦 Bundle All Excel Reports
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, dast-security-tests, load-tests]
    if: always()

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Selenium Report
        uses: actions/download-artifact@v4
        with:
          name: 📊-Selenium-Test-Report
          path: all-reports/Selenium
        continue-on-error: true

      - name: 📥 Download Appium Report
        uses: actions/download-artifact@v4
        with:
          name: 📊-Appium-Test-Report
          path: all-reports/Appium
        continue-on-error: true

      - name: 📥 Download DAST Report
        uses: actions/download-artifact@v4
        with:
          name: 📊-DAST-Security-Report
          path: all-reports/DAST-Security
        continue-on-error: true

      - name: 📥 Download Load Test Report
        uses: actions/download-artifact@v4
        with:
          name: 📊-Load-Test-Report
          path: all-reports/Load-Tests
        continue-on-error: true

      - name: 📋 List All Collected Reports
        run: |
          echo "============================================"
          echo "  ALL TEST EXCEL REPORTS"
          echo "============================================"
          find all-reports -name "*.xlsx" -type f | while read f; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "  ✅ $f  ($SIZE)"
          done
          echo "============================================"
          TOTAL=$(find all-reports -name "*.xlsx" | wc -l)
          echo "  Total Excel Files: $TOTAL"

      - name: 📤 Upload ALL Reports as Single Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 🗂️-ALL-TEST-REPORTS-BUNDLE
          path: all-reports/
          retention-days: 60

      - name: 📊 Publish GitHub Actions Summary
        if: always()
        run: |
          echo "## 🧪 TravelNest — Full Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Selenium E2E | Web Frontend | ${{ needs.selenium-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Appium Mobile | Android App  | ${{ needs.appium-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 DAST Security | API Security | ${{ needs.dast-security-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Load Tests | Performance  | ${{ needs.load-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Excel Reports" >> $GITHUB_STEP_SUMMARY
          echo "All Excel reports are available under the **Artifacts** section of this workflow run:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`📊-Selenium-Test-Report\` — Selenium E2E results (300 test cases)" >> $GITHUB_STEP_SUMMARY
          echo "- \`📊-Appium-Test-Report\` — Appium mobile results (300 test cases)" >> $GITHUB_STEP_SUMMARY
          echo "- \`📊-DAST-Security-Report\` — DAST security findings (174 test cases)" >> $GITHUB_STEP_SUMMARY
          echo "- \`📊-Load-Test-Report\` — Load test results (10 scenarios, 100 users, 60s)" >> $GITHUB_STEP_SUMMARY
          echo "- \`🗂️-ALL-TEST-REPORTS-BUNDLE\` — **All 4 reports bundled in one download**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SELENIUM_OK="${{ needs.selenium-tests.result }}"
          APPIUM_OK="${{ needs.appium-tests.result }}"
          DAST_OK="${{ needs.dast-security-tests.result }}"
          LOAD_OK="${{ needs.load-tests.result }}"
          if [[ "$SELENIUM_OK" == "success" && "$APPIUM_OK" == "success" && "$DAST_OK" == "success" && "$LOAD_OK" == "success" ]]; then
            echo "### ✅ All 4 Test Suites Passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Some test suites need attention. Check individual job logs." >> $GITHUB_STEP_SUMMARY
          fi
