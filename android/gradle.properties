# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.debug=none

# Force Java 21 for Gradle to avoid Java 25 incompatibility with Groovy/Gradle
org.gradle.java.home=C:/Program Files/Java/jdk-21

# AndroidX
android.useAndroidX=true

# Fix TLS issues on restricted networks
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
systemProp.org.gradle.internal.network.ntlm.enabled=true
